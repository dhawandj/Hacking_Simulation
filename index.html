    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;700&family=Share+Tech+Mono&display=swap');

      body {
        background-color: #000;
        color: #0f0;
        font-family: 'Share Tech Mono', monospace;
        overflow: hidden;
      }

      /* CRT Scanline Effect - Controlled via React now, but styles remain */
      .scanlines {
        background: linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0),
          rgba(255, 255, 255, 0) 50%,
          rgba(0, 0, 0, 0.2) 50%,
          rgba(0, 0, 0, 0.2)
        );
        background-size: 100% 4px;
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 50;
        pointer-events: none;
        animation: scroll 10s linear infinite;
      }

      .crt-flicker {
        animation: flicker 0.15s infinite;
        pointer-events: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 255, 0, 0.02);
        z-index: 49;
      }

      /* Scrollbar Customization */
      ::-webkit-scrollbar {
        width: 8px;
        background: #001100;
      }
      ::-webkit-scrollbar-thumb {
        background: #003300;
        border: 1px solid #00ff00;
      }

      @keyframes scroll {
        0% { background-position: 0 0; }
        100% { background-position: 0 100%; }
      }

      @keyframes flicker {
        0% { opacity: 0.9; }
        50% { opacity: 1.0; }
        100% { opacity: 0.9; }
      }

      .text-glow {
        text-shadow: 0 0 5px currentColor, 0 0 10px currentColor;
      }
      
      /* Theme specific glows if needed, but currentcolor works for most dynamic text */
      .box-glow {
        box-shadow: 0 0 10px rgba(0, 255, 0, 0.3), inset 0 0 20px rgba(0, 255, 0, 0.1);
      }
    </style>
